#
# Shared configuration for the regression test networks.
#
# This file exists so the per-network ini files stay exactly as authored: it supplies
# only the settings the regression harness needs, and includes each network below.
# afdx/simulations/AutoNetwork.ini is deliberately untouched by any of this.
#
# Run from the afdx/test directory (the route-table paths in the network inis are
# relative to the working directory):
#
#   ../src/afdx -u Cmdenv -c <ConfigName> -n .:../src:../../queueinglib \
#               --result-dir=networks/<folder>/results regression.ini
#
# Normally you would use ./run_tests.sh instead, which handles all of the above.
#

[General]

# The network inis set no stopTime and no numJobs, and queueinglib's Source defaults
# both to "no limit" (queueinglib/Source.ned:25,31), so without a limit here the
# sources generate frames forever and the runs never terminate.
sim-time-limit = 1s

# Capture everything by default. Unlike AutoNetwork.ini, queueLength and lifeTime are
# NOT disabled here -- the baseline should record what the model currently produces,
# and narrowing is a later, deliberate choice.
**.vector-recording = true
**.scalar-recording = true

# 0 is already the default; stated explicitly so the baseline's seed is documented
# rather than implied.
seed-set = 0

print-undisposed = false

# result-dir is intentionally not set here. Folder names and config names differ
# (basicTwoEndSystem -> BasicTwoEndSystems, simpleNetwork -> SimpleNetwork,
# realisticNetwork -> realisticNetwork), so ${configname} cannot derive the folder.
# run_tests.sh passes --result-dir per network instead.

include networks/basicTwoEndSystem/basicTwoEndSystem.ini
include networks/simpleNetwork/simpleNetwork.ini
include networks/realisticNetwork/realisticNetwork.ini
