[SimpleNetwork]
network = afdxtest.networks.simpleNetwork.simpleNetwork

# =====================================================================
# STRUCTURAL SIZING (per-instance, both redundant planes mirror each other)
# =====================================================================
# Switch index: 0=S1(4 ports) 1=S2(3 ports) 2=S3(3 ports) 3=S4(3 ports) 4=S5(2 ports)
simpleNetwork.SwitchA[0].noOfPorts = 4
simpleNetwork.SwitchB[0].noOfPorts = 4
simpleNetwork.SwitchA[1].noOfPorts = 3
simpleNetwork.SwitchB[1].noOfPorts = 3
simpleNetwork.SwitchA[2].noOfPorts = 3
simpleNetwork.SwitchB[2].noOfPorts = 3
simpleNetwork.SwitchA[3].noOfPorts = 3
simpleNetwork.SwitchB[3].noOfPorts = 3
simpleNetwork.SwitchA[4].noOfPorts = 2
simpleNetwork.SwitchB[4].noOfPorts = 2

# ES index: 0=E0 1=E1 2=E2 3=E3 4=E4 5=E5 6=E6
simpleNetwork.ES[0].messageCount = 3   # sources V1, V2, V12
simpleNetwork.ES[1].messageCount = 1   # sources V5
simpleNetwork.ES[2].messageCount = 1   # sources V11
# ES[3] (E3) is destination-only, messageCount defaults to 0
simpleNetwork.ES[4].messageCount = 3   # sources V8, V9, V13
simpleNetwork.ES[5].messageCount = 2   # sources V6, V7
simpleNetwork.ES[6].messageCount = 1   # sources V14

# ---- per-switch VL routing tables (identical topology on both planes -> shared files) ----
simpleNetwork.SwitchA[0].switchFabric.router.configTableName = "networks/simpleNetwork/S1.txt"
simpleNetwork.SwitchB[0].switchFabric.router.configTableName = "networks/simpleNetwork/S1.txt"
simpleNetwork.SwitchA[1].switchFabric.router.configTableName = "networks/simpleNetwork/S2.txt"
simpleNetwork.SwitchB[1].switchFabric.router.configTableName = "networks/simpleNetwork/S2.txt"
simpleNetwork.SwitchA[2].switchFabric.router.configTableName = "networks/simpleNetwork/S3.txt"
simpleNetwork.SwitchB[2].switchFabric.router.configTableName = "networks/simpleNetwork/S3.txt"
simpleNetwork.SwitchA[3].switchFabric.router.configTableName = "networks/simpleNetwork/S4.txt"
simpleNetwork.SwitchB[3].switchFabric.router.configTableName = "networks/simpleNetwork/S4.txt"
simpleNetwork.SwitchA[4].switchFabric.router.configTableName = "networks/simpleNetwork/S5.txt"
simpleNetwork.SwitchB[4].switchFabric.router.configTableName = "networks/simpleNetwork/S5.txt"

# =====================================================================
# GENERAL SETTINGS (matching basicTwoEndSystem's established defaults)
# =====================================================================
**.redundancyChecker.skewMax = 10ms
**.regulatorLogic.maxVLIDQueueSize = 1000
**.scheduler.serviceTime = 0s
**.switchFabric.delay.delay = 50us
**.ES[*].latencyTechTx.delay = 50us
**.ES[*].latencyTechRx.delay = 50us
**.afdxMarshall[*].networkId = 0x99
**.afdxMarshall[*].interfaceId = 0
**.afdxMarshall[*].seqNum = 0
**.afdxMarshall[*].udpSrcPort = 0x1234
**.afdxMarshall[*].udpDestPort = 0x5678
**.afdxMarshall[*].frameHeaderLength = 47
**.skewMaxTester.skewMaxTestEnabled = false
**.channel.datarate = 100Mbps
**.channel.length = 10m

# cosmetic per-end-system id, doesn't affect routing/timing
simpleNetwork.ES[0].afdxMarshall[*].equipmentId = 0
simpleNetwork.ES[1].afdxMarshall[*].equipmentId = 1
simpleNetwork.ES[2].afdxMarshall[*].equipmentId = 2
simpleNetwork.ES[3].afdxMarshall[*].equipmentId = 3
simpleNetwork.ES[4].afdxMarshall[*].equipmentId = 4
simpleNetwork.ES[5].afdxMarshall[*].equipmentId = 5
simpleNetwork.ES[6].afdxMarshall[*].equipmentId = 6

# =====================================================================
# VIRTUAL LINK TRAFFIC GENERATION (from docs/virtual-link-description.png, Table 6.1)
#
# Per VL: interArrivalTime = BAG, startTime = offset O, packetLength = p (payload bytes;
# afdxMarshall adds frameHeaderLength=47 on top to form the wire frame).
#
# rho = Lmax / BAG (the VL's sustained rate, Lmax = wire frame incl. the 47B header +
# 20B phy overhead). sigma is 4x Lmax: the textbook sigma=Lmax is exact-equality tight
# and was verified (empirically, by running the model) to cause TrafficPolicy to drop
# essentially every frame at the 2nd+ switch hop, because a VL gets re-policed at every
# hop and each hop's port multiplexes several VLs, which reshapes a VL's spacing away
# from perfectly-periodic before the next hop sees it. 4x Lmax was the smallest margin
# that produced zero drops over a 5s run (390k+ frames) across every VL/switch in this
# topology; see requirements.md sec 4 for the derivation and the empirical check.
# =====================================================================

# ---- E0 (ES[0]): V1(idx0), V2(idx1), V12(idx2) ----
