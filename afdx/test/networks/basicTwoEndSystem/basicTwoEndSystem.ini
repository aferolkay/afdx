[BasicTwoEndSystems]
network = afdxtest.networks.basicTwoEndSystem.basicTwoEndSystem
basicTwoEndSystem.Switch[*].switchFabric.router.configTableName = "networks/basicTwoEndSystem/switchRouteTable.txt"

# general settings
**.redundancyChecker.skewMax = 10ms
**.regulatorLogic.maxVLIDQueueSize = 1000
**.scheduler.serviceTime = 0s
**.switchFabric.delay.delay = 50us
**.ES[*].latencyTechTx.delay = 50us
**.ES[*].latencyTechRx.delay = 50us
**.afdxMarshall[*].networkId = 0x99
**.afdxMarshall[*].equipmentId = 0x66
**.afdxMarshall[*].interfaceId = 0
**.afdxMarshall[*].seqNum = 0
**.afdxMarshall[*].udpSrcPort = 0x1234
**.afdxMarshall[*].udpDestPort = 0x5678
**.afdxMarshall[*].frameHeaderLength = 47
**.skewMaxTester.skewMaxTestEnabled = false
**.channel.datarate = 100Mbps
**.channel.length = 10m

# =====================================================================
# AFDX TRAFFIC GENERATION (ES[0] -> Virtual Link 0x1000)
# =====================================================================

# 1. Spin up 1 message stream on ES[0]
basicTwoEndSystem.ES[0].messageCount = 1

# 2. Base physical properties
**.ES[0].messageSource[0].baudrate = 100Mbps
**.ES[0].messageSource[0].cableLength = 10m

# 3. Source_ext Pacing Parameters
**.ES[0].messageSource[0].interArrivalTime = 32ms   
**.ES[0].messageSource[0].packetLength = 256
**.ES[0].messageSource[0].partitionId = 1            

# 4. AFDX Protocol Marshalling Parameters
**.ES[0].afdxMarshall[0].virtualLinkId = 0x1000     
**.ES[0].afdxMarshall[0].BAG = 32ms                 
       
**.ES[0].afdxMarshall[0].rho = 0.133375Mbps    
**.ES[0].afdxMarshall[0].sigma = 8602.6875

